<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA - llama3.2:3b</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0e14] text-gray-200 h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-3xl flex flex-col h-full bg-[#151921] rounded-xl shadow-2xl border border-gray-800 overflow-hidden">
        
        <div class="p-4 bg-[#1c212c] border-b border-gray-700 flex items-center justify-between">
            <h2 class="text-blue-400 font-mono font-bold">API Terminal: llama3.2:3b</h2>
            <span class="text-xs bg-green-900 text-green-300 px-2 py-1 rounded">POST ACTIVE</span>
        </div>

        <div id="display" class="flex-1 overflow-y-auto p-6 space-y-4 font-sans">
            <div class="bg-gray-800/50 p-3 rounded border border-gray-700 text-sm italic text-gray-400">
                Esperando comando...
            </div>
        </div>

        <div class="p-4 bg-[#1c212c]">
            <div class="flex gap-3">
                <input 
                    type="text" 
                    id="pregunta" 
                    placeholder="Escribe tu prompt aquí..." 
                    class="flex-1 bg-[#0b0e14] border border-gray-600 rounded px-4 py-2 focus:border-blue-500 outline-none"
                >
                <button 
                    onclick="ejecutarFetch()" 
                    id="btn"
                    class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded font-bold transition-all"
                >
                    EJECUTAR
                </button>
            </div>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const input = document.getElementById('pregunta');
        const btn = document.getElementById('btn');

        async function ejecutarFetch() {
            const texto = input.value.trim();
            if (!texto) return;

            // Renderizar mensaje de usuario
            imprimirMensaje(texto, 'usuario');
            input.value = '';
            
            // Bloqueo de UI
            btn.disabled = true;
            btn.innerText = "PROCESANDO...";

            try {
                // Petición idéntica a tu comando CURL
                const response = await fetch("http://187.127.253.96:11434/api/generate", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        "model": "llama3.2:3b",
                        "prompt": texto,
                        "stream": false
                    })
                });

                if (!response.ok) throw new Error("Error en la respuesta del servidor");

                const data = await response.json();
                imprimirMensaje(data.response, 'ia');

            } catch (err) {
                imprimirMensaje("ERROR: No se pudo conectar con la API. Verifica CORS u OLLAMA_HOST.", 'error');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = "EJECUTAR";
            }
        }

        function imprimirMensaje(msg, tipo) {
            const div = document.createElement('div');
            let estilos = "p-3 rounded max-w-[90%] ";
            
            if (tipo === 'usuario') estilos += "bg-blue-900/30 border border-blue-500 self-end ml-auto text-blue-100";
            else if (tipo === 'ia') estilos += "bg-gray-800 border border-gray-700 text-gray-200";
            else estilos += "bg-red-900/40 border border-red-500 text-red-200";

            div.className = estilos;
            div.innerText = msg;
            display.appendChild(div);
            display.scrollTop = display.scrollHeight;
        }

        // Enviar con Enter
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') ejecutarFetch(); });
    </script>
</body>
</html>
